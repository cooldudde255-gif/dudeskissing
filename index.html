<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crazy Mouse Battle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #ui {
      margin-bottom: 10px;
      text-align: center;
    }
    h1 { color: #6366f1; margin-bottom: 4px; font-size: 1.8rem; }
    p { color: #94a3b8; font-size: 0.9rem; }
    canvas {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div id="ui">
    <h1>🐭 Crazy Mouse Battle</h1>
    <p>Move your mouse to control the Player. Click to Attack enemy mice!</p>
    <p id="scoreBoard" style="margin-top: 6px; font-size: 1.1rem; font-weight: bold; color: #10b981;">Score: 0 | Health: 100</p>
  </div>

  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBoard = document.getElementById('scoreBoard');

    let score = 0;
    let health = 100;
    let gameOver = false;

    // Player position follows mouse
    const player = { x: 300, y: 200, radius: 15, color: '#6366f1' };
    const mousePos = { x: 300, y: 200 };

    // Enemies (Crazy Mice)
    const enemies = [];
    const attacks = [];

    // Track mouse movement
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    // Click to attack
    canvas.addEventListener('click', () => {
      if (gameOver) {
        restartGame();
        return;
      }
      attacks.push({
        x: player.x,
        y: player.y,
        radius: 5,
        maxRadius: 40,
        color: '#38bdf8'
      });
    });

    // Spawn Enemy Mouse
    function spawnEnemy() {
      if (gameOver) return;
      const radius = 12;
      let x, y;
      if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
        y = Math.random() * canvas.height;
      } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
      }
      enemies.push({ x, y, radius, speed: 1.5 + Math.random() * 1.5, color: '#ef4444' });
    }

    setInterval(spawnEnemy, 1000);

    function restartGame() {
      score = 0;
      health = 100;
      enemies.length = 0;
      attacks.length = 0;
      gameOver = false;
      animate();
    }

    function update() {
      if (gameOver) return;

      // Smoothly move player to mouse cursor
      player.x += (mousePos.x - player.x) * 0.15;
      player.y += (mousePos.y - player.y) * 0.15;

      // Update attacks
      for (let i = attacks.length - 1; i >= 0; i--) {
        const a = attacks[i];
        a.radius += 3;
        if (a.radius > a.maxRadius) {
          attacks.splice(i, 1);
        }
      }

      // Update enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        // Move towards player
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.hypot(dx, dy);

        e.x += (dx / dist) * e.speed;
        e.y += (dy / dist) * e.speed;

        // Check attack hits enemy
        for (let j = attacks.length - 1; j >= 0; j--) {
          const a = attacks[j];
          const hitDist = Math.hypot(a.x - e.x, a.y - e.y);
          if (hitDist < a.radius + e.radius) {
            enemies.splice(i, 1);
            score += 10;
            break;
          }
        }

        // Check enemy hits player
        if (dist < player.radius + e.radius) {
          health -= 10;
          enemies.splice(i, 1);
          if (health <= 0) {
            health = 0;
            gameOver = true;
          }
        }
      }

      scoreBoard.innerText = `Score: ${score} | Health: ${health}`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Attacks
      attacks.forEach(a => {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
        ctx.strokeStyle = a.color;
        ctx.lineWidth = 3;
        ctx.stroke();
      });

      // Draw Player Mouse
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();

      // Draw Enemies
      enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = e.color;
        ctx.fill();
      });

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 30px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = '#fff';
        ctx.font = '18px system-ui';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
        ctx.fillText('Click anywhere to restart', canvas.width / 2, canvas.height / 2 + 55);
      }
    }

    function animate() {
      update();
      draw();
      if (!gameOver) {
        requestAnimationFrame(animate);
      }
    }

    animate();
  </script>
</body>
</html>
