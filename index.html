<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Zone | Verified Unblocked Games</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--accent); }
    p { color: var(--muted); }

    .search-box {
      max-width: 500px;
      margin: 1.5rem auto;
      display: flex;
    }
    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #334155;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .card-body { padding: 1rem; }
    .card-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.25rem; }
    .card-tag { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      width: 90%; max-width: 900px;
      height: 80vh;
      border-radius: 12px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 0.75rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #334155;
    }
    .close-btn {
      background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <h1>Arcade Zone</h1>
    <p>Select a game to start playing instantly</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search games..." onkeyup="filterGames()" />
    </div>
  </header>

  <div class="grid" id="gameGrid">

    <!-- Game 1: Clumsy Bird -->
    <div class="card" onclick="openGame('https://ellisonleao.github.io/clumsy-bird/', 'Clumsy Bird')">
      <img src="https://raw.githubusercontent.com/ellisonleao/clumsy-bird/master/data/img/bg.png" alt="Clumsy Bird" />
      <div class="card-body">
        <div class="card-title">Clumsy Bird</div>
        <div class="card-tag">Arcade</div>
      </div>
    </div>

    <!-- Game 2: Pacman -->
    <div class="card" onclick="openGame('https://pacman.com/', 'Pacman')">
      <img src="https://raw.githubusercontent.com/luciopanepinto/pacman/master/img/pacman.png" alt="Pacman" />
      <div class="card-body">
        <div class="card-title">Pacman</div>
        <div class="card-tag">Retro</div>
      </div>
    </div>

    <!-- Game 3: Snake -->
    <div class="card" onclick="openGame('https://patorjk.com/games/snake/', 'Snake')">
      <img src="https://patorjk.com/games/snake/snake.png" alt="Snake" />
      <div class="card-body">
        <div class="card-title">Snake</div>
        <div class="card-tag">Classic</div>
      </div>
    </div>

    <!-- Game 4: Breakout -->
    <div class="card" onclick="openGame('https://jakesgordon.github.io/javascript-breakout/', 'Breakout')">
      <img src="https://jakesgordon.github.io/javascript-breakout/breakout.png" alt="Breakout" />
      <div class="card-body">
        <div class="card-title">Breakout</div>
        <div class="card-tag">Arcade</div>
      </div>
    </div>

    <!-- Game 5: Asteroids -->
    <div class="card" onclick="openGame('https://jakesgordon.github.io/javascript-asteroids/', 'Asteroids')">
      <img src="https://jakesgordon.github.io/javascript-asteroids/asteroids.png" alt="Asteroids" />
      <div class="card-body">
        <div class="card-title">Asteroids</div>
        <div class="card-tag">Retro</div>
      </div>
    </div>

    <!-- Game 6: Pong -->
    <div class="card" onclick="openGame('https://jakesgordon.github.io/javascript-pong/', 'Pong')">
      <img src="https://jakesgordon.github.io/javascript-pong/pong.png" alt="Pong" />
      <div class="card-body">
        <div class="card-title">Pong</div>
        <div class="card-tag">Classic</div>
      </div>
    </div>

  </div>

  <!-- Player Modal -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle" style="font-weight: bold;">Game</span>
        <button class="close-btn" onclick="closeGame()">&times;</button>
      </div>
      <iframe id="gameFrame" src=""></iframe>
    </div>
  </div>

  <script>
    function openGame(url, title) {
      document.getElementById('gameFrame').src = url;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('gameFrame').src = '';
      document.getElementById('gameModal').style.display = 'none';
    }

    function filterGames() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        card.style.display = title.includes(q) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
