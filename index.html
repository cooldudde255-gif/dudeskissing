<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Disguised Tab Title -->
  <title>Google Classroom</title>
  <!-- Google Classroom Favicon Disguise -->
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--accent); }
    p { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #334155;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .card-title { font-weight: bold; font-size: 1.3rem; margin-bottom: 0.5rem; }
    .card-tag { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 12px;
      display: flex; flex-direction: column; align-items: center;
      border: 1px solid #334155;
      width: 90%; max-width: 900px; height: 80vh;
    }
    .modal-header {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.5rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid #334155;
    }
    .close-btn {
      background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;
    }
    #gameContainer {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    iframe { width: 100%; height: 100%; border: none; border-radius: 8px; background: #000; }
    canvas { background: #000; border-radius: 8px; max-width: 100%; }

    /* Tic-Tac-Toe Grid Styling */
    #tttBoard {
      display: grid; grid-template-columns: repeat(3, 90px); gap: 8px;
    }
    .ttt-cell {
      width: 90px; height: 90px; background: #334155; display: flex;
      align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold;
      cursor: pointer; border-radius: 8px; user-select: none;
    }
    .ttt-cell:hover { background: #475569; }
  </style>
</head>
<body>

  <header>
    <h1>sick g games</h1>
    <p>Select a game to play</p>
  </header>

  <div class="grid">

    <!-- Game 1: Construct 3 Game -->
    <div class="card" onclick="openIframe('./New%20project/index.html', 'My Construct 3 Game')">
      <div class="card-title">🚀 Construct 3 Game</div>
      <div class="card-tag">Custom Game</div>
    </div>

    <!-- Game 2: Crazy Mouse Battle -->
    <div class="card" onclick="openIframe('./crazy-mouse/index.html', 'Crazy Mouse Battle')">
      <div class="card-title">🐭 Crazy Mouse</div>
      <div class="card-tag">Local Game</div>
    </div>

    <!-- Game 3: Clumsy Bird -->
    <div class="card" onclick="openIframe('https://ellisonleao.github.io/clumsy-bird/', 'Clumsy Bird')">
      <div class="card-title">🐦 Clumsy Bird</div>
      <div class="card-tag">Arcade</div>
    </div>

    <!-- Game 4: Snake (Built-in) -->
    <div class="card" onclick="startSnake()">
      <div class="card-title">🐍 Snake</div>
      <div class="card-tag">Built-In</div>
    </div>

    <!-- Game 5: Tic-Tac-Toe (Built-in) -->
    <div class="card" onclick="startTTT()">
      <div class="card-title">❌ Tic-Tac-Toe</div>
      <div class="card-tag">2-Player Local</div>
    </div>

    <!-- Game 6: Breakout (Built-in) -->
    <div class="card" onclick="startBreakout()">
      <div class="card-title">🧱 Breakout</div>
      <div class="card-tag">Built-In</div>
    </div>

    <!-- Game 7: Dodge (Built-in) -->
    <div class="card" onclick="startDodge()">
      <div class="card-title">🔴 Dodge</div>
      <div class="card-tag">Built-In</div>
    </div>

  </div>

  <!-- Player Modal -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle" style="font-weight: bold; font-size: 1.2rem;">Game</span>
        <button class="close-btn" onclick="closeGame()">&times;</button>
      </div>
      <div id="gameContainer"></div>
    </div>
  </div>

  <script>
    let gameInterval = null;

    function closeGame() {
      if (gameInterval) clearInterval(gameInterval);
      document.getElementById('gameContainer').innerHTML = '';
      document.getElementById('gameModal').style.display = 'none';
    }

    function openIframe(url, title) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('gameContainer').innerHTML = `<iframe src="${url}"></iframe>`;
      document.getElementById('gameModal').style.display = 'flex';
    }

    /* --- BUILT-IN GAME 1: SNAKE --- */
    function startSnake() {
      document.getElementById('modalTitle').innerText = 'Snake (Use Arrow Keys)';
      document.getElementById('gameContainer').innerHTML = '<canvas id="snakeCanvas" width="400" height="400"></canvas>';
      document.getElementById('gameModal').style.display = 'flex';

      const canvas = document.getElementById('snakeCanvas');
      const ctx = canvas.getContext('2d');
      let px = 10, py = 10, gs = 20, tc = 20, ax = 15, ay = 15, xv = 0, yv = 0;
      let trail = [], tail = 5;

      document.onkeydown = function(e) {
        if(e.keyCode===37 && xv!==1) { xv=-1; yv=0; }
        if(e.keyCode===38 && yv!==1) { xv=0; yv=-1; }
        if(e.keyCode===39 && xv!==-1) { xv=1; yv=0; }
        if(e.keyCode===40 && yv!==-1) { xv=0; yv=1; }
      };

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(function() {
        px += xv; py += yv;
        if(px < 0) px = tc-1; if(px > tc-1) px = 0;
        if(py < 0) py = tc-1; if(py > tc-1) py = 0;

        ctx.fillStyle = "#0f172a"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#10b981";
        for(let i=0; i<trail.length; i++) {
          ctx.fillRect(trail[i].x*gs, trail[i].y*gs, gs-2, gs-2);
          if(trail[i].x===px && trail[i].y===py) tail = 5;
        }
        trail.push({x:px, y:py});
        while(trail.length > tail) trail.shift();

        if(ax===px && ay===py) {
          tail++;
          ax = Math.floor(Math.random()*tc);
          ay = Math.floor(Math.random()*tc);
        }
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(ax*gs, ay*gs, gs-2, gs-2);
      }, 1000/15);
    }

    /* --- BUILT-IN GAME 2: TIC-TAC-TOE --- */
    function startTTT() {
      document.getElementById('modalTitle').innerText = 'Tic-Tac-Toe';
      document.getElementById('gameContainer').innerHTML = '<div id="tttBoard"></div>';
      document.getElementById('gameModal').style.display = 'flex';

      const board = document.getElementById('tttBoard');
      let turn = 'X', cells = Array(9).fill('');

      function render() {
        board.innerHTML = '';
        cells.forEach((val, idx) => {
          const div = document.createElement('div');
          div.className = 'ttt-cell';
          div.innerText = val;
          div.onclick = () => {
            if(!cells[idx]) {
              cells[idx] = turn;
              turn = turn === 'X' ? 'O' : 'X';
              render();
            }
          };
          board.appendChild(div);
        });
      }
      render();
    }

    /* --- BUILT-IN GAME 3: BREAKOUT --- */
    function startBreakout() {
      document.getElementById('modalTitle').innerText = 'Breakout (Move Mouse or Left/Right Keys)';
      document.getElementById('gameContainer').innerHTML = '<canvas id="boCanvas" width="480" height="320"></canvas>';
      document.getElementById('gameModal').style.display = 'flex';

      const canvas = document.getElementById('boCanvas');
      const ctx = canvas.getContext('2d');
      let x = canvas.width/2, y = canvas.height-30, dx = 2, dy = -2;
      let ballRadius = 8, paddleHeight = 10, paddleWidth = 75;
      let paddleX = (canvas.width-paddleWidth)/2;
      let rightPressed = false, leftPressed = false;
      let rowCount = 3, colCount = 5, brickW = 75, brickH = 20, padding = 10, offsetTop = 30, offsetLeft = 30;

      let bricks = [];
      for(let c=0; c<colCount; c++) {
        bricks[c] = [];
        for(let r=0; r<rowCount; r++) { bricks[c][r] = { x: 0, y: 0, status: 1 }; }
      }

      document.addEventListener("keydown", (e) => {
        if(e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
        if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
      });
      document.addEventListener("keyup", (e) => {
        if(e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
        if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
      });
      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        let relativeX = e.clientX - rect.left;
        if(relativeX > 0 && relativeX < canvas.width) paddleX = relativeX - paddleWidth/2;
      });

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height);

        for(let c=0; c<colCount; c++) {
          for(let r=0; r<rowCount; r++) {
            let b = bricks[c][r];
            if(b.status === 1) {
              let bx = (c*(brickW+padding))+offsetLeft, by = (r*(brickH+padding))+offsetTop;
              b.x = bx; b.y = by;
              ctx.fillStyle = "#6366f1"; ctx.fillRect(bx, by, brickW, brickH);
              if(x > bx && x < bx+brickW && y > by && y < by+brickH) { dy = -dy; b.status = 0; }
            }
          }
        }

        ctx.beginPath(); ctx.arc(x, y, ballRadius, 0, Math.PI*2); ctx.fillStyle = "#38bdf8"; ctx.fill(); ctx.closePath();
        ctx.fillStyle = "#10b981"; ctx.fillRect(paddleX, canvas.height-paddleHeight, paddleWidth, paddleHeight);

        if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) dx = -dx;
        if(y + dy < ballRadius) dy = -dy;
        else if(y + dy > canvas.height-ballRadius) {
          if(x > paddleX && x < paddleX + paddleWidth) dy = -dy;
          else { x = canvas.width/2; y = canvas.height-30; dx = 2; dy = -2; }
        }

        if(rightPressed && paddleX < canvas.width-paddleWidth) paddleX += 5;
        else if(leftPressed && paddleX > 0) paddleX -= 5;

        x += dx; y += dy;
      }, 10);
    }

    /* --- BUILT-IN GAME 4: DODGE --- */
    function startDodge() {
      document.getElementById('modalTitle').innerText = 'Dodge (Move Mouse to Avoid Red Dots)';
      document.getElementById('gameContainer').innerHTML = '<canvas id="dgCanvas" width="400" height="400"></canvas>';
      document.getElementById('gameModal').style.display = 'flex';

      const canvas = document.getElementById('dgCanvas');
      const ctx = canvas.getContext('2d');
      let pX = 200, pY = 200, score = 0;
      let enemies = [];

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        pX = e.clientX - rect.left; pY = e.clientY - rect.top;
      });

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        ctx.fillStyle = "#0f172a"; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(Math.random() < 0.1) {
          enemies.push({
            x: Math.random() * canvas.width, y: 0,
            speed: 2 + Math.random() * 3, r: 8
          });
        }

        ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(pX, pY, 12, 0, Math.PI*2); ctx.fill();

        for(let i = enemies.length - 1; i >= 0; i--) {
          let e = enemies[i];
          e.y += e.speed;
          ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();

          let dist = Math.hypot(pX - e.x, pY - e.y);
          if(dist < 12 + e.r) { enemies = []; score = 0; }
          if(e.y > canvas.height) { enemies.splice(i, 1); score++; }
        }

        ctx.fillStyle = "#fff"; ctx.font = "14px system-ui"; ctx.fillText(`Score: ${score}`, 10, 20);
      }, 1000/30);
    }
  </script>
</body>
</html>
