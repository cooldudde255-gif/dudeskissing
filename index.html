<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Zone | Built-In Unblocked Games</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--accent); }
    p { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #334155;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .card-title { font-weight: bold; font-size: 1.4rem; margin-bottom: 0.5rem; }
    .card-tag { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; }

    /* Modal Player Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      display: flex; flex-direction: column; align-items: center;
      border: 1px solid #334155;
      max-width: 500px; width: 90%;
    }
    .modal-header {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
    }
    .close-btn {
      background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;
    }
    canvas { background: #000; border-radius: 8px; max-width: 100%; }

    /* Tic-Tac-Toe Grid */
    #tttBoard {
      display: grid; grid-template-columns: repeat(3, 90px); gap: 5px; margin-top: 10px;
    }
    .ttt-cell {
      width: 90px; height: 90px; background: #334155; display: flex;
      align-items: center; justify-content: center; font-size: 2rem; font-weight: bold;
      cursor: pointer; border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Arcade Zone</h1>
    <p>All games hosted 100% inside your site (No external sources)</p>
  </header>

  <div class="grid">
    <div class="card" onclick="startSnake()">
      <div class="card-title">🐍 Snake</div>
      <div class="card-tag">Use Arrow Keys</div>
    </div>

    <div class="card" onclick="startPong()">
      <div class="card-title">🏓 Pong</div>
      <div class="card-tag">Mouse or Touch</div>
    </div>

    <div class="card" onclick="startTTT()">
      <div class="card-title">❌ Tic-Tac-Toe</div>
      <div class="card-tag">2-Player Local</div>
    </div>
  </div>

  <!-- Game Modal Container -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle" style="font-weight: bold; font-size: 1.2rem;">Game</span>
        <button class="close-btn" onclick="closeGame()">&times;</button>
      </div>
      <div id="gameContainer"></div>
    </div>
  </div>

  <script>
    let gameInterval = null;

    function closeGame() {
      if (gameInterval) clearInterval(gameInterval);
      document.getElementById('gameContainer').innerHTML = '';
      document.getElementById('gameModal').style.display = 'none';
    }

    /* --- GAME 1: SNAKE --- */
    function startSnake() {
      document.getElementById('modalTitle').innerText = 'Snake';
      document.getElementById('gameContainer').innerHTML = '<canvas id="gc" width="400" height="400"></canvas>';
      document.getElementById('gameModal').style.display = 'flex';

      const canvas = document.getElementById('gc');
      const ctx = canvas.getContext('2d');
      let px = 10, py = 10, gs = 20, tc = 20, ax = 15, ay = 15, xv = 0, yv = 0;
      let trail = [], tail = 5;

      document.onkeydown = function(e) {
        if(e.keyCode===37 && xv!==1) { xv=-1; yv=0; }
        if(e.keyCode===38 && yv!==1) { xv=0; yv=-1; }
        if(e.keyCode===39 && xv!==-1) { xv=1; yv=0; }
        if(e.keyCode===40 && yv!==-1) { xv=0; yv=1; }
      };

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(function() {
        px += xv; py += yv;
        if(px < 0) px = tc-1; if(px > tc-1) px = 0;
        if(py < 0) py = tc-1; if(py > tc-1) py = 0;

        ctx.fillStyle = "#0f172a"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#10b981";
        for(let i=0; i<trail.length; i++) {
          ctx.fillRect(trail[i].x*gs, trail[i].y*gs, gs-2, gs-2);
          if(trail[i].x===px && trail[i].y===py) tail = 5;
        }
        trail.push({x:px, y:py});
        while(trail.length > tail) trail.shift();

        if(ax===px && ay===py) {
          tail++;
          ax = Math.floor(Math.random()*tc);
          ay = Math.floor(Math.random()*tc);
        }
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(ax*gs, ay*gs, gs-2, gs-2);
      }, 1000/15);
    }

    /* --- GAME 2: PONG --- */
    function startPong() {
      document.getElementById('modalTitle').innerText = 'Pong';
      document.getElementById('gameContainer').innerHTML = '<canvas id="gc" width="400" height="300"></canvas>';
      document.getElementById('gameModal').style.display = 'flex';

      const canvas = document.getElementById('gc');
      const ctx = canvas.getContext('2d');
      let bx = 200, by = 150, xv = 4, yv = 4, p1 = 120, p2 = 120;

      canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        p1 = e.clientY - rect.top - 30;
      });

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(function() {
        bx += xv; by += yv;
        if(by < 0 || by > canvas.height) yv = -yv;
        if(bx < 0) { bx = 200; by = 150; xv = 4; }
        if(bx > canvas.width) { bx = 200; by = 150; xv = -4; }

        if(bx < 20 && by > p1 && by < p1 + 60) xv = -xv;
        if(bx > canvas.width - 20 && by > p2 && by < p2 + 60) xv = -xv;

        p2 += (by - (p2 + 30)) * 0.1; // Simple AI

        ctx.fillStyle = "#0f172a"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#fff";
        ctx.fillRect(10, p1, 10, 60);
        ctx.fillRect(canvas.width - 20, p2, 10, 60);
        ctx.fillRect(bx-4, by-4, 8, 8);
      }, 1000/30);
    }

    /* --- GAME 3: TIC-TAC-TOE --- */
    function startTTT() {
      document.getElementById('modalTitle').innerText = 'Tic-Tac-Toe';
      document.getElementById('gameContainer').innerHTML = '<div id="tttBoard"></div>';
      document.getElementById('gameModal').style.display = 'flex';

      const board = document.getElementById('tttBoard');
      let turn = 'X', cells = Array(9).fill('');

      function render() {
        board.innerHTML = '';
        cells.forEach((val, idx) => {
          const div = document.createElement('div');
          div.className = 'ttt-cell';
          div.innerText = val;
          div.onclick = () => {
            if(!cells[idx]) {
              cells[idx] = turn;
              turn = turn === 'X' ? 'O' : 'X';
              render();
            }
          };
          board.appendChild(div);
        });
      }
      render();
    }
  </script>
</body>
</html>
