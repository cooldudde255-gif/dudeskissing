<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Zone | My Construct 3 Games</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--accent); }
    p { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #334155;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .card-title { font-weight: bold; font-size: 1.4rem; margin-bottom: 0.5rem; }
    .card-tag { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; }

    /* Modal Player Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 12px;
      display: flex; flex-direction: column; align-items: center;
      border: 1px solid #334155;
      width: 90%; max-width: 900px; height: 80vh;
    }
    .modal-header {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.5rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid #334155;
    }
    .close-btn {
      background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;
    }
    iframe {
      width: 100%; height: 100%; border: none; border-radius: 8px; background: #000;
    }
  </style>
</head>
<body>

  <header>
    <h1>Arcade Zone</h1>
    <p>Construct 3 Games Hosted Direct</p>
  </header>

  <div class="grid">
    <!-- Construct 3 Game Card pointing to 'New project' -->
    <div class="card" onclick="openGame('./New%20project/index.html', 'My Construct 3 Game')">
      <div class="card-title">🎮 My Construct Game</div>
      <div class="card-tag">Construct 3</div>
    </div>
  </div>

  <!-- Game Player Modal -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle" style="font-weight: bold; font-size: 1.2rem;">Game</span>
        <button class="close-btn" onclick="closeGame()">&times;</button>
      </div>
      <iframe id="gameFrame" src=""></iframe>
    </div>
  </div>

  <script>
    function openGame(gamePath, title) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('gameFrame').src = gamePath;
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('gameFrame').src = '';
      document.getElementById('gameModal').style.display = 'none';
    }
  </script>
</body>
</html>
